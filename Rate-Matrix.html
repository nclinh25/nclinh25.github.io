const STORE_KEY = "ratecard:data:v1";

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function fmtAUD(v) {
  if (v === null || v === undefined || v === "") return "";
  if (typeof v === "string") return v;
  return "$" + Number(v).toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDate(iso) {
  if (!iso) return "";
  const p = iso.split("-");
  if (p.length !== 3) return iso;
  return p[2] + "/" + p[1] + "/" + p[0];
}

function useStore() {
  const [data, setData] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const res = await STORAGE.get(STORE_KEY);
        if (alive && res && res.value) {
          setData(JSON.parse(res.value));
          setReady(true);
          return;
        }
      } catch (e) { /* not found */ }
      if (alive) {
        const seeded = clone(SEED);
        setData(seeded);
        setReady(true);
        try { await STORAGE.set(STORE_KEY, JSON.stringify(seeded)); } catch (e) {}
      }
    })();
    return () => { alive = false; };
  }, []);

  const persist = useCallback(async (next) => {
    setData(next);
    try { await STORAGE.set(STORE_KEY, JSON.stringify(next)); } catch (e) {}
  }, []);

  return { data, ready, persist, setData };
}

function normaliseProfile(p) {
  return {
    frequency: p?.frequency || "",
    containerTypes: Array.isArray(p?.containerTypes) ? p.containerTypes : [],
    productTypes: Array.isArray(p?.productTypes) ? p.productTypes : [],
    engagementType: p?.engagementType || "",

    movementType: p?.movementType || "",
    expectedWeeklyVolume: p?.expectedWeeklyVolume ?? "",
    expectedWeeklyRevenue: p?.expectedWeeklyRevenue ?? "",
    averagePalletsHeld: p?.averagePalletsHeld ?? "",
    averageStorageDays: p?.averageStorageDays ?? "",
    notes: p?.notes || "",
  };
}

function toggleItem(arr, value) {
  return arr.includes(value) ? arr.filter((x) => x !== value) : [...arr, value];
}

function MultiSelect({ options, value, onChange }) {
  return <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
    {options.map((o) => {
      const on = value.includes(o);
      return <button key={o} type="button" onClick={() => onChange(toggleItem(value, o))}
        style={{ ...styles.btn(), padding: "6px 10px", background: on ? BLUE_SOFT : "#fff", borderColor: on ? BLUE : "#bcd3ec", color: on ? BLUE_DK : "#50677f" }}>
        {on && <i className="ti ti-check" style={{ marginRight: 4 }} />}{o}
      </button>;
    })}
  </div>;
}

function SingleSelectButtons({ options, value, onChange }) {
  return <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
    {options.map((o) => {
      const on = value === o;
      return <button key={o} type="button" onClick={() => onChange(o)}
        style={{ ...styles.btn(), padding: "6px 10px", background: on ? BLUE_SOFT : "#fff", borderColor: on ? BLUE : "#bcd3ec", color: on ? BLUE_DK : "#50677f" }}>
        {on && <i className="ti ti-check" style={{ marginRight: 4 }} />}{o}
      </button>;
    })}
  </div>;
}

function matchScore(profile, quote) {
  let score = 0, possible = 0;
  const exact = (a, b, weight) => { if (b) { possible += weight; if (a === b) score += weight; } };
  const overlap = (a, b, weight) => {
    if (b?.length) {
      possible += weight;
      const matches = b.filter((x) => a?.includes(x)).length;
      score += weight * (matches / b.length);
    }
  };
  exact(profile.frequency, quote.frequency, 18);
  exact(profile.engagementType, quote.engagementType, 12);
  overlap(profile.containerTypes, quote.containerTypes, 18);
  overlap(profile.productTypes, quote.productTypes, 24);
  overlap(profile.orderTypes, quote.orderTypes, 10);
  exact(profile.movementType, quote.movementType, 15);
  const numericCloseness = (a, b, weight) => {
    const x = Number(a), y = Number(b);
    if (y > 0) {
      possible += weight;
      if (x > 0) score += weight * Math.max(0, 1 - Math.abs(x-y)/Math.max(x,y));
    }
  };
  numericCloseness(profile.expectedWeeklyVolume, quote.expectedWeeklyVolume, 10);
  numericCloseness(profile.averageStorageDays, quote.averageStorageDays, 8);
  return possible ? Math.round((score / possible) * 100) : 0;
}

  return <Modal title={"Customer profile · " + customer.name} onClose={onClose}>
    <label style={lbl}>Frequency</label>
    <select style={styles.input} value={profile.frequency} onChange={(e) => set("frequency", e.target.value)}>
      <option value="">— select —</option>{PROFILE_OPTIONS.frequency.map((x) => <option key={x}>{x}</option>)}

    <label style={lbl}>Engagement type</label>
    <select style={styles.input} value={profile.engagementType} onChange={(e) => set("engagementType", e.target.value)}>

    <label style={lbl}>Container type</label><MultiSelect options={PROFILE_OPTIONS.containerTypes} value={profile.containerTypes} onChange={(v) => set("containerTypes", v)} />
    <label style={lbl}>Product / service type</label><MultiSelect options={PROFILE_OPTIONS.productTypes} value={profile.productTypes} onChange={(v) => set("productTypes", v)} />
    <label style={lbl}>Movement / order type</label><MultiSelect options={PROFILE_OPTIONS.orderTypes} value={profile.orderTypes} onChange={(v) => set("orderTypes", v)} />
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
      <div><label style={lbl}>Expected weekly volume</label><input type="number" style={styles.input} value={profile.expectedWeeklyVolume} onChange={(e) => set("expectedWeeklyVolume", e.target.value)} placeholder="Cartons" /></div>

      <div><label style={lbl}>Average storage days</label><input type="number" style={styles.input} value={profile.averageStorageDays} onChange={(e) => set("averageStorageDays", e.target.value)} /></div>

}

function commonItems(a, b) {
  return (b || []).filter((x) => (a || []).includes(x));
}

function matchReasons(profile, quote) {
  const reasons = [];
  if (quote.frequency && profile.frequency === quote.frequency) reasons.push("Same " + quote.frequency.toLowerCase() + " service frequency");
  if (quote.engagementType && profile.engagementType === quote.engagementType) reasons.push("Same " + quote.engagementType.toLowerCase() + " engagement pattern");
  const products = commonItems(profile.productTypes, quote.productTypes);
  if (products.length) reasons.push("Matching product/service type: " + products.join(", "));
  const containers = commonItems(profile.containerTypes, quote.containerTypes);
  if (containers.length) reasons.push("Matching container type: " + containers.join(", "));
  const orders = commonItems(profile.orderTypes, quote.orderTypes);
  if (orders.length) reasons.push("Matching order type: " + orders.join(", "));
  if (quote.movementType && profile.movementType === quote.movementType) reasons.push("Same " + quote.movementType.toLowerCase() + " movement type");
  const pv = Number(profile.expectedWeeklyVolume), qv = Number(quote.expectedWeeklyVolume);
  if (pv > 0 && qv > 0) {
    const diff = Math.abs(pv-qv)/Math.max(pv,qv);
    if (diff <= .15) reasons.push("Very similar expected weekly volume");
    else if (diff <= .35) reasons.push("Comparable expected weekly volume");
  }
  const ps = Number(profile.averageStorageDays), qs = Number(quote.averageStorageDays);
  if (ps > 0 && qs > 0) {
    const diff = Math.abs(ps-qs)/Math.max(ps,qs);
    if (diff <= .20) reasons.push("Similar average storage duration");
  }
  if (!reasons.length) reasons.push("Closest available profile based on the information currently recorded");
  return reasons.slice(0,5);
}

function medianNumericRate(data, serviceId) {
  const vals = [];
  data.customers.forEach((c) => c.accounts.forEach((a) => {
    const v = a.cur?.[serviceId];
    if (typeof v === "number" && isFinite(v)) vals.push(v);
  }));
  if (!vals.length) return null;
  vals.sort((a,b)=>a-b);
  const m = Math.floor(vals.length/2);
  return vals.length % 2 ? vals[m] : (vals[m-1]+vals[m])/2;
}

function isFixedLabourRate(service) {
  return service.section === "Overtime weekdays" ||
    service.section === "Saturday - Minimum 4 hours Charge" ||
    service.section === "Sundays or Public Holidays - Minimum 4 hours Charge";
}

function isPalletRate(service) {
  const code = (service.code || "").toUpperCase().replace(/\s/g, "");
  return code === "PICKP" || code === "RECP" || code === "STOPP/STOP" || /per pallet/i.test(service.desc || "");
}

function recommendedAdjustment(service, sampleProfile, quote, answers = {}) {
  if (quote.movementType === "Carton" && isPalletRate(service)) {
    return { pct: 0, fixed: true, forceZero: true, reasons: ["Movement type is carton, so this pallet-based service should not be charged."] };
  }
  if (isFixedLabourRate(service)) {
    return { pct: 0, fixed: true, reasons: ["This is an approved overtime, Saturday, Sunday or public-holiday labour rate. It is kept exactly the same as the sample rate and is never automatically increased or discounted."] };
  }
  let pct = 0;
  const reasons = [];
  if (quote.engagementType === "One-off") { pct += 10; reasons.push("The work is one-off, so onboarding, account setup, operational planning and unused-capacity risk must be recovered over a shorter period rather than across ongoing weekly activity."); }
  else if (quote.engagementType === "Trial") { pct += 5; reasons.push("The arrangement is a trial. There is not yet enough operating history to confirm stable volume, labour efficiency, order patterns or stock movement, so a temporary risk allowance is included."); }
  else if (quote.engagementType === "Ongoing") reasons.push("The customer is expected to be ongoing, which supports using the sample rate as the main benchmark without a one-off setup premium.");

  if (quote.frequency === "Ad hoc") { pct += 8; reasons.push("Ad hoc work is harder to roster and may require labour, dock time or cold-storage capacity to be available without guaranteed utilisation."); }
  else if (quote.frequency === "Monthly") { pct += 4; reasons.push("Monthly activity provides less regular labour and capacity utilisation than weekly work, so fixed administration and planning costs are spread across fewer movements."); }
  else if (quote.frequency === "Weekly") reasons.push("Weekly activity provides predictable utilisation and therefore does not require an additional frequency premium.");

  const sv = Number(sampleProfile.expectedWeeklyVolume), qv = Number(quote.expectedWeeklyVolume);
  if (sv > 0 && qv > 0) {
    const ratio = qv / sv;
    if (ratio < .5) { pct += 8; reasons.push(`Forecast weekly volume is ${Math.round((1-ratio)*100)}% below the sample customer. A higher unit rate is recommended because account administration, setup, receiving coordination and warehouse effort are spread across substantially fewer units.`); }
    else if (ratio < .75) { pct += 4; reasons.push(`Forecast weekly volume is ${Math.round((1-ratio)*100)}% below the sample customer. The sample rate may not recover the same cost per carton or pallet at this lower activity level.`); }
    else if (ratio > 1.5) { pct -= 3; reasons.push(`Forecast weekly volume is approximately ${Math.round((ratio-1)*100)}% above the sample customer. A modest scale allowance is applied because recurring fixed effort is spread across more units, while retaining margin.`); }
    else if (ratio > 1.25) { pct -= 2; reasons.push("Forecast weekly volume is moderately higher than the sample customer, supporting a small scale allowance while keeping the benchmark commercially sustainable."); }
    else reasons.push("Forecast weekly volume is broadly comparable with the sample customer, so no material volume adjustment is required.");
  } else reasons.push("Comparable weekly volume information is incomplete, so no volume discount is assumed until the expected activity is confirmed.");

  const ss = Number(sampleProfile.averageStorageDays), qs = Number(quote.averageStorageDays);
  if (service.type === "Storage") {
    if (ss > 0 && qs > ss) {
      const ratio = qs / ss;
      if (ratio > 1.5) { pct += 10; reasons.push("Expected storage duration is more than 50% longer than the sample customer. Slow-moving stock occupies limited cold-storage capacity and can prevent higher-turnover blast, receiving or dispatch work from being accepted."); }
      else { pct += 5; reasons.push("Expected storage duration is longer than the sample customer, increasing the opportunity cost of each occupied storage position."); }
    }
    if (answers.capacityUtilisation) {
      const cap = Number(answers.capacityUtilisation);
      if (cap >= 90) { pct += 8; reasons.push(`Current storage utilisation is within the ${answers.capacityUtilisation}% bucket. Capacity is highly constrained, so a stronger capacity premium is required to protect space for higher-value work.`); }
      else if (cap >= 80) { pct += 4; reasons.push(`Current storage utilisation is within the ${answers.capacityUtilisation}% bucket. A moderate capacity-risk allowance is included because remaining space is limited.`); }
      else reasons.push(`Current storage utilisation is within the ${answers.capacityUtilisation}% bucket, so no additional capacity premium is required at this stage.`);
    }
  }

  const growth = Number(answers.volumeGrowthConfidence);
  if (growth >= 75) { pct -= 3; reasons.push(`Management confidence that volume will increase within three months is ${growth}%. A provisional growth allowance is applied because there is a strong expectation of improved utilisation.`); }
  else if (growth === 50) { reasons.push("Confidence in three-month volume growth is 50%, so no discount is applied until the increase becomes more certain."); }
  else if (growth === 30) { pct += 3; reasons.push("Confidence in three-month volume growth is only 30%. The recommended rate therefore relies on the current confirmed volume rather than an uncertain future increase."); }
  else if (answers.volumeGrowthConfidence === "Not sure") { pct += 3; reasons.push("Future volume growth is not yet known, so the rate is based on the current confirmed activity and includes protection against under-utilisation."); }

  if (answers.minimumCommitment === "Yes") { pct -= 3; reasons.push("The customer will provide a minimum volume or revenue commitment, reducing the risk of unused capacity and supporting a lower rate."); }
  else if (answers.minimumCommitment === "No") { pct += 4; reasons.push("No minimum volume or revenue commitment is offered, so Austco Polar carries the risk of low or irregular utilisation."); }
  else if (answers.minimumCommitment === "Under discussion") reasons.push("A minimum commitment is still under discussion, so no commitment-based discount is applied yet.");

  if (/20ft/i.test(service.desc) && quote.containerTypes.includes("20ft") && !(sampleProfile.containerTypes || []).includes("20ft")) { pct += 5; reasons.push("20ft container activity is not part of the sample profile. The recommendation allows for a different loading pattern, dock allocation and labour requirement."); }
  if (/40ft/i.test(service.desc) && quote.containerTypes.includes("40ft") && !(sampleProfile.containerTypes || []).includes("40ft")) { pct += 5; reasons.push("40ft container activity is additional to the sample profile and can require longer dock occupation, more labour and greater coordination."); }
  if (service.type === "Blast" && quote.productTypes.includes("Blast") && !(sampleProfile.productTypes || []).includes("Blast")) { pct += 8; reasons.push("Blast freezing is additional to the sample profile and uses high-value blast capacity, energy and handling resources. The premium protects the strongest-margin constrained service."); }
  if (service.section === "Service - Chilled" && quote.productTypes.includes("Chilled") && !(sampleProfile.productTypes || []).includes("Chilled")) { pct += 5; reasons.push("Chilled handling is additional to the sample profile and may require dedicated temperature-controlled space and workflow."); }
  if (answers.additionalInformation?.trim()) reasons.push("Additional commercial information considered: " + answers.additionalInformation.trim());
  pct = Math.max(-5, Math.min(25, pct));
  return { pct, fixed: false, reasons };
}

function buildQuoteRows(data, quote, selectedMatch, answers = {}) {
  const sample = selectedMatch.customer;
  const profile = selectedMatch.profile;
  const account = sample.accounts[0];
  const suggested = data.services.filter((s) => {
    if (quote.productTypes.includes("Blast") && s.type === "Blast") return true;
    if (quote.productTypes.includes("Frozen") && s.section === "Service - Frozen") return true;
    if (quote.productTypes.includes("Chilled") && s.section === "Service - Chilled") return true;
    if (quote.orderTypes.includes("Export") && s.section === "Administration Charges") return true;
    if (quote.containerTypes.includes("20ft") && /20ft/i.test(s.desc)) return true;
    if (quote.containerTypes.includes("40ft") && /40ft/i.test(s.desc)) return true;
    return false;
  });
  const ids = new Set([...Object.keys(account?.cur || {}), ...suggested.map(s=>s.id)]);
  return data.services.filter(s=>ids.has(s.id)).map(s => {
    const sampleRate = account?.cur?.[s.id];
    const base = sampleRate !== undefined ? sampleRate : medianNumericRate(data, s.id);
    const adj = recommendedAdjustment(s, profile, quote, answers);
    let recommended = adj.forceZero ? 0 : base;
    if (!adj.forceZero && typeof base === "number") recommended = Math.round(base * (1 + adj.pct/100) * 100) / 100;
    return { service:s, sampleRate, base, recommended, adjustment:adj, accepted:false };
  });
}


function quoteDisplayCode(quote) { return (quote.customerCode || quote.prospectName || "Customer").trim(); }
function quoteLegalName(quote) { return (quote.legalCustomerName || quote.prospectName || "").trim(); }

function xmlEscape(v) { return String(v ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;"); }
function crc32(bytes) { let c=0xffffffff; for (let i=0;i<bytes.length;i++){c^=bytes[i]; for(let k=0;k<8;k++) c=(c>>>1)^((c&1)?0xedb88320:0);} return (c^0xffffffff)>>>0; }

function concatBytes(parts) {
  const total = parts.reduce((sum, part) => sum + part.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  parts.forEach((part) => { out.set(part, offset); offset += part.length; });

}
function makeZip(files){
  const enc = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let localOffset = 0;

  files.forEach((file) => {
    const name = enc.encode(file.name);
    const data = typeof file.data === "string" ? enc.encode(file.data) : file.data;
    const crc = crc32(data);

    const localHeader = concatBytes([
      new Uint8Array([0x50,0x4b,0x03,0x04]),
      new Uint8Array(u16(20)),              // version needed
      new Uint8Array(u16(0x0800)),          // UTF-8 filename flag
      new Uint8Array(u16(0)),               // stored, no compression
      new Uint8Array(u16(0)),               // time
      new Uint8Array(u16(0)),               // date
      new Uint8Array(u32(crc)),
      new Uint8Array(u32(data.length)),
      new Uint8Array(u32(data.length)),
      new Uint8Array(u16(name.length)),
      new Uint8Array(u16(0)),
      name
    ]);
    localParts.push(localHeader, data);

    const centralHeader = concatBytes([
      new Uint8Array([0x50,0x4b,0x01,0x02]),
      new Uint8Array(u16(20)),              // version made by
      new Uint8Array(u16(20)),              // version needed
      new Uint8Array(u16(0x0800)),          // UTF-8 filename flag
      new Uint8Array(u16(0)),               // stored, no compression
      new Uint8Array(u16(0)),               // time
      new Uint8Array(u16(0)),               // date
      new Uint8Array(u32(crc)),
      new Uint8Array(u32(data.length)),
      new Uint8Array(u32(data.length)),
      new Uint8Array(u16(name.length)),
      new Uint8Array(u16(0)),               // extra length
      new Uint8Array(u16(0)),               // comment length
      new Uint8Array(u16(0)),               // disk number
      new Uint8Array(u16(0)),               // internal attributes
      new Uint8Array(u32(0)),               // external attributes
      new Uint8Array(u32(localOffset)),
      name
    ]);
    centralParts.push(centralHeader);
    localOffset += localHeader.length + data.length;
  });

  const centralDirectory = concatBytes(centralParts);
  const endRecord = concatBytes([
    new Uint8Array([0x50,0x4b,0x05,0x06]),
    new Uint8Array(u16(0)),
    new Uint8Array(u16(0)),
    new Uint8Array(u16(files.length)),
    new Uint8Array(u16(files.length)),
    new Uint8Array(u32(centralDirectory.length)),
    new Uint8Array(u32(localOffset)),
    new Uint8Array(u16(0))
  ]);

  const completeZip = concatBytes([...localParts, centralDirectory, endRecord]);
  return new Blob([completeZip], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  });
}

      <div><label style={lbl}>Current storage capacity utilised</label><select style={styles.input} value={answers.capacityUtilisation} onChange={e=>setA("capacityUtilisation",e.target.value)}><option value="">— select —</option><option value="50">Below 60%</option><option value="70">60%–75%</option><option value="80">76%–85%</option><option value="90">86%–90%</option><option value="95">Above 90%</option></select></div>

function SavedQuotes({ onOpen }) {
  const [items,setItems]=useState(loadQuotes());
  useEffect(()=>{
    const refresh=()=>setItems(loadQuotes());
    refresh();
    window.addEventListener("storage",refresh);
    window.addEventListener("focus",refresh);
    return ()=>{window.removeEventListener("storage",refresh);window.removeEventListener("focus",refresh);};
  },[]);
  const [deleteItem,setDeleteItem]=useState(null);
  const [deletePassword,setDeletePassword]=useState("");
  const [deleteError,setDeleteError]=useState("");
  const filtered=items.filter(x=>x.status==="quoted");
  function confirmDelete(){
    if(deletePassword!=="apcs"){setDeleteError("Incorrect password.");return;}
    const next=items.filter(x=>x.id!==deleteItem.id);saveQuotes(next);setItems(next);setDeleteItem(null);setDeletePassword("");setDeleteError("");

      {deleteError&&<div style={{marginTop:8,color:"#A32D2D",fontSize:12.5}}>{deleteError}</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}><button style={styles.btn()} onClick={()=>setDeleteItem(null)}>Cancel</button><button style={styles.btn("danger")} onClick={confirmDelete}><i className="ti ti-trash" style={{marginRight:5}}/>Delete permanently</button></div>

    <div style={{...styles.card,padding:18}}>{!filtered.length?<div style={{fontSize:13,color:"#7790a8"}}>No rate has been quoted yet.</div>:filtered.map(x=><div key={x.id} style={{display:"flex",alignItems:"center",padding:"9px 0",borderBottom:"1px solid #eef3f9"}}><div><strong>{quoteDisplayCode(x.quote)}</strong><div style={{fontSize:12,color:"#7790a8"}}>{quoteLegalName(x.quote)} · Sample: {x.selectedCustomer} · Updated {fmtDate(x.updatedAt||x.createdAt)}</div></div><div style={{marginLeft:"auto",display:"flex",gap:8}}><button title="Download rate card as XLSX" style={{...styles.btn(),padding:"8px 10px"}} onClick={()=>exportRateCardXlsx(x,x.rows||[],"Quoted")}><i className="ti ti-file-spreadsheet" /></button><button title="Open quoted rate card" style={{...styles.btn(),padding:"8px 10px"}} onClick={()=>onOpen(x)}><i className="ti ti-folder-open" /></button><button title="Delete quoted rate card" style={{...styles.btn("danger"),padding:"8px 10px"}} onClick={()=>{setDeleteItem(x);setDeletePassword("");setDeleteError("");}}><i className="ti ti-x" /></button></div></div>)}</div>
  </div>;
}

function excelColumnName(n) {
  let s = "";
  while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}

function exportCurrentRatesXlsx(data) {
  const accounts = [];
  const customerGroups = [];
  data.customers.forEach((customer) => {
    const start = accounts.length + 4;
    customer.accounts.forEach((account) => accounts.push({ customer, account }));
    const end = accounts.length + 3;
    if (end >= start) customerGroups.push({ customer, start, end });
  });

  const rows = [];
  const merges = ["A1:A2", "B1:B2"];
  const header1 = [
    { value: "Type", style: 2 },
    { value: "Code", style: 2 },
    { value: "Service description", style: 2 }
  ];
  customerGroups.forEach((group) => {
    header1.push({ value: `T${group.customer.tier ?? "-"}  ${group.customer.name}`, style: 1 });
    for (let c = group.start + 1; c <= group.end; c++) header1.push({ value: "", style: 1 });
    if (group.start !== group.end) merges.push(`${excelColumnName(group.start)}1:${excelColumnName(group.end)}1`);
  });
  rows.push(header1);
  rows.push([
    null, null, { value: "WMS code →", style: 3 },
    ...accounts.map(({ account }) => ({ value: account.wms, style: 3 }))
  ]);

  data.sectionOrder.forEach((section) => {
    const sectionServices = data.services.filter((service) => service.section === section);
    if (!sectionServices.length) return;
    const rowNumber = rows.length + 1;
    rows.push([{ value: section, style: 4 }, ...Array(accounts.length + 2).fill(null)]);
    merges.push(`A${rowNumber}:${excelColumnName(accounts.length + 3)}${rowNumber}`);
    sectionServices.forEach((service) => {
      rows.push([
        { value: service.type || "", style: 5 },
        { value: service.code || "—", style: 6 },
        { value: service.desc || "", style: 5 },
        ...accounts.map(({ account }) => {
          const value = account.cur?.[service.id];
          return { value: value === undefined ? "" : value, style: typeof value === "number" ? 7 : 5 };
        })
      ]);
    });
  });

  function cellXml(cell, col, row) {
    if (cell === null || cell === undefined) return "";
    const ref = `${excelColumnName(col)}${row}`;
    const style = cell?.style ?? 0;
    const value = cell?.value ?? "";
    if (typeof value === "number" && Number.isFinite(value)) return `<c r="${ref}" s="${style}"><v>${value}</v></c>`;
    return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(value)}</t></is></c>`;
  }
  const sheetRows = rows.map((row, ri) => `<row r="${ri + 1}">${row.map((cell, ci) => cellXml(cell, ci + 1, ri + 1)).join("")}</row>`).join("");
  const customerWidths = accounts.map((_, i) => `<col min="${i + 4}" max="${i + 4}" width="16" customWidth="1"/>`).join("");
  const mergeXml = merges.length ? `<mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join("")}</mergeCells>` : "";
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <dimension ref="A1:${excelColumnName(accounts.length + 3)}${rows.length}"/>
  <sheetViews><sheetView workbookViewId="0"><pane xSplit="3" ySplit="2" topLeftCell="D3" activePane="bottomRight" state="frozen"/></sheetView></sheetViews>
  <sheetFormatPr defaultRowHeight="15"/>
  <cols><col min="1" max="1" width="15" customWidth="1"/><col min="2" max="2" width="12" customWidth="1"/><col min="3" max="3" width="42" customWidth="1"/>${customerWidths}</cols>
  <sheetData>${sheetRows}</sheetData>
  ${mergeXml}
  <pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/>
</worksheet>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <numFmts count="1"><numFmt numFmtId="164" formatCode="$#,##0.00;[Red]-$#,##0.00"/></numFmts>
  <fonts count="4">
    <font><sz val="10"/><name val="Segoe UI"/></font>
    <font><b/><color rgb="FFFFFFFF"/><sz val="10"/><name val="Segoe UI"/></font>
    <font><b/><color rgb="FF0C447C"/><sz val="10"/><name val="Segoe UI"/></font>
    <font><b/><color rgb="FF185FA5"/><sz val="10"/><name val="Segoe UI"/></font>
  </fonts>
  <fills count="5">
    <fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FF1D5A96"/><bgColor indexed="64"/></patternFill></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFE6F1FB"/><bgColor indexed="64"/></patternFill></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFF0F6FC"/><bgColor indexed="64"/></patternFill></fill>
  </fills>
  <borders count="2"><border/><border><left style="thin"><color rgb="FFE3EBF4"/></left><right style="thin"><color rgb="FFE3EBF4"/></right><top style="thin"><color rgb="FFE3EBF4"/></top><bottom style="thin"><color rgb="FFE3EBF4"/></bottom></border></borders>
  <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
  <cellXfs count="8">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>

      cust.accounts.forEach((acc) => c.push({ custName: cust.name, tier: cust.tier, wms: acc.wms, cur: acc.cur }));
    });

  }, [data]);

  const groups = useMemo(() => {
    const g = [];
    data.customers.forEach((cust) => g.push({ name: cust.name, tier: cust.tier, span: cust.accounts.length }));

              <th style={{ ...stickyL, left: 0, zIndex: 7, top: 0, height: 34, minWidth: 90, padding: "8px 10px", borderBottom: "2px solid " + BLUE_LINE, borderRight: "1px solid #e3ebf4", background: BLUE_SOFT, ...styles.th }}>Type</th>
              <th style={{ ...stickyL, left: 90, zIndex: 7, top: 0, height: 34, minWidth: 74, padding: "8px 10px", borderBottom: "2px solid " + BLUE_LINE, borderRight: "1px solid #e3ebf4", background: BLUE_SOFT, ...styles.th }}>Code</th>
              <th style={{ ...stickyL, left: 164, zIndex: 7, top: 0, height: 34, minWidth: 240, padding: "8px 10px", borderBottom: "2px solid " + BLUE_LINE, borderRight: "2px solid " + BLUE_LINE, background: BLUE_SOFT, ...styles.th }}>Service description</th>
              {groups.map((g, i) => (
                <th key={i} colSpan={g.span} style={{ top: 0, height: 34, position: "sticky", zIndex: 4, padding: "6px 10px", textAlign: "center", background: BLUE_HEAD, color: "#fff", fontSize: 12.5, fontWeight: 600, borderRight: "2px solid #16487e", borderBottom: "0.5px solid #2f6aa8", whiteSpace: "nowrap" }}>
                  <span style={{ ...tierPill(g.tier), marginRight: 6 }}>T{g.tier ?? "-"}</span>{g.name}

            <tr>
              <th style={{ ...stickyL, left: 0, zIndex: 6, top: 34, background: "#f0f6fc", borderRight: "1px solid #e3ebf4", borderBottom: "1px solid " + BLUE_LINE }}></th>

              <th style={{ ...stickyL, left: 164, zIndex: 6, top: 34, background: "#f0f6fc", borderRight: "2px solid " + BLUE_LINE, borderBottom: "1px solid " + BLUE_LINE, fontSize: 11, color: "#7790a8", padding: "4px 10px", textAlign: "left", fontWeight: 500 }}>WMS code →</th>

                </tr>

                  <tr key={s.id} style={{ background: ri % 2 ? "#fbfdff" : "#fff" }}>
                    <td style={{ ...stickyL, left: 0, background: "inherit", padding: "5px 10px", fontSize: 11.5, color: "#62788f", borderRight: "1px solid #eef3f9", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>{s.type}</td>
                    <td style={{ ...stickyL, left: 90, background: "inherit", padding: "5px 10px", fontSize: 12, fontWeight: 600, color: BLUE, borderRight: "1px solid #eef3f9", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>{s.code || "—"}</td>
                    <td style={{ ...stickyL, left: 164, background: "inherit", padding: "5px 10px", fontSize: 12.5, borderRight: "2px solid " + BLUE_LINE, borderBottom: "0.5px solid #eef3f9", maxWidth: 240 }}>{s.desc}</td>
                    {cols.map((c, ci) => {
                      const v = c.cur[s.id];
                      return <td key={ci} style={{ ...cellNum, color: v === undefined ? "#c9d4e0" : "#1b2733", borderRight: "1px solid #f1f5fa" }}>{v === undefined ? "" : fmtAUD(v)}</td>;
                    })}
                  </tr>
                ))}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const lbl = { display: "block", fontSize: 12.5, fontWeight: 600, color: BLUE_DK, margin: "12px 0 5px" };

function EditRates({ data, persist }) {
  const [selCust, setSelCust] = useState(data.customers[0]?.name || "");
  const [selWms, setSelWms] = useState(data.customers[0]?.accounts[0]?.wms || "");
  const [drafts, setDrafts] = useState({});
  const [showAdd, setShowAdd] = useState(false);
  const [showDelete, setShowDelete] = useState(false);
  const [confirmText, setConfirmText] = useState("");
  const [toast, setToast] = useState("");
  const [editMode, setEditMode] = useState(false);
  const [histSvc, setHistSvc] = useState(null);
  const [showProfile, setShowProfile] = useState(false);
  const [showAddRate, setShowAddRate] = useState(false);
  const [addRate, setAddRate] = useState({serviceId:"",rate:"",manual:false,laborRole:"",laborPeriod:"",section:"Service - Frozen",type:"Handling",code:"",desc:""});

  const cust = data.customers.find((c) => c.name === selCust);
  const acc = cust?.accounts.find((a) => a.wms === selWms);

  useEffect(() => {
    if (cust && !cust.accounts.find((a) => a.wms === selWms)) setSelWms(cust.accounts[0]?.wms || "");
  }, [selCust]);

  useEffect(() => { setDrafts({}); setEditMode(false); }, [selCust, selWms]);

  const setDraft = (id, val) => setDrafts((d) => ({ ...d, [id]: val }));

  function prevForService(id) {
    const h = (acc?.history || []).filter((e) => e.id === id);
    if (!h.length) return null;
    const last = h[h.length - 1];
    if (last.from === null || last.from === undefined) return null;
    return { rate: last.from, date: last.date };
  }

  const newServiceIds = useMemo(() => {
    const s = new Set();
    if (!acc) return s;
    Object.keys(drafts).forEach((id) => {
      const raw = drafts[id];
      if (raw !== "" && raw !== undefined && acc.cur[id] === undefined) s.add(id);
    });
    return s;
  }, [drafts, acc]);

  const dirtyCount = Object.keys(drafts).filter((id) => {
    const v = drafts[id];
    const cur = acc?.cur[id];
    const curStr = cur === undefined ? "" : String(cur);
    const isRemoval = String(v).trim() === "" || String(v).trim() === "0";
    if (isRemoval && cur === undefined) return false;
    return String(v) !== curStr;
  }).length;

  function applyUpdate() {
    if (!cust || !acc) return;
    const next = clone(data);
    const nc = next.customers.find((c) => c.name === selCust);
    const na = nc.accounts.find((a) => a.wms === selWms);
    const stamp = todayISO();
    if (!na.history) na.history = [];
    let changed = 0;
    Object.keys(drafts).forEach((id) => {
      let raw = drafts[id];
      const prev = na.cur[id];
      const prevStr = prev === undefined ? "" : String(prev);
      const isRemoval = raw === "" || raw === undefined || String(raw).trim() === "0";

      if (isRemoval) {
        if (prev !== undefined) {
          na.history.push({ id, from: prev, to: null, date: stamp, action: "remove" });
          delete na.cur[id];
          changed++;
        }
        return;
      }

      let valNum = raw;
      if (!isNaN(parseFloat(raw)) && isFinite(raw)) valNum = parseFloat(raw);
      if (String(valNum) === prevStr) return;
      const action = prev === undefined ? "new" : "change";
      na.history.push({ id, from: prev === undefined ? null : prev, to: valNum, date: stamp, action });
      na.cur[id] = valNum;
      changed++;
    });
    persist(next);
    setDrafts({});
    setEditMode(false);
    setToast(changed + " rate" + (changed === 1 ? "" : "s") + " updated · " + fmtDate(stamp));
    setTimeout(() => setToast(""), 3200);
  }

  function createCustomer(name, tier, wms, templateKey) {
    const next = clone(data);
    let cur = {}, old = {};
    if (templateKey) {
      const [tn, tw] = templateKey.split("|");
      const tc = next.customers.find((c) => c.name === tn);
      const ta = tc?.accounts.find((a) => a.wms === tw);
      if (ta) cur = clone(ta.cur);
    }
    next.customers.push({ name, tier, profile: normaliseProfile({}), accounts: [{ wms, cur, old, history: [] }] });
    persist(next);
    setShowAdd(false);
    setSelCust(name); setSelWms(wms);
    setToast("Customer " + name + " added");
    setTimeout(() => setToast(""), 3000);
  }

  function addAccount() {
    const code = prompt("New WMS code for " + selCust + ":");
    if (!code) return;
    const next = clone(data);
    const nc = next.customers.find((c) => c.name === selCust);
    if (nc.accounts.find((a) => a.wms === code.toUpperCase())) { alert("That WMS code already exists."); return; }
    nc.accounts.push({ wms: code.toUpperCase(), cur: {}, old: {}, history: [] });
    persist(next);
    setSelWms(code.toUpperCase());
  }

  function deleteAccount() {
    if (!cust || !acc) return;
    if (cust.accounts.length <= 1) {
      alert("This is the customer's only account. Use \"Delete customer\" to remove the whole customer instead.");
      return;
    }
    if (!window.confirm("Delete account \"" + acc.wms + "\" from " + cust.name + "?\n\nThis removes its rates and history and cannot be undone.")) return;
    const next = clone(data);
    const nc = next.customers.find((c) => c.name === selCust);
    nc.accounts = nc.accounts.filter((a) => a.wms !== selWms);
    persist(next);
    setSelWms(nc.accounts[0].wms);
    setToast("Account " + acc.wms + " deleted");
    setTimeout(() => setToast(""), 3000);
  }

  function deleteCustomer() {
    if (!cust) return;
    setConfirmText("");
    setShowDelete(true);
  }

  function confirmDeleteCustomer() {
    const next = clone(data);
    next.customers = next.customers.filter((c) => c.name !== selCust);
    if (!next.customers.length) {
      alert("You can't delete the last remaining customer.");
      return;
    }
    persist(next);
    setShowDelete(false);
    const first = next.customers[0];
    setSelCust(first.name);
    setSelWms(first.accounts[0]?.wms || "");
    setToast("Customer " + cust.name + " deleted");
    setTimeout(() => setToast(""), 3000);
  }

  function saveCustomerProfile(profile) {
    const next = clone(data);
    const nc = next.customers.find((c) => c.name === selCust);
    nc.profile = normaliseProfile(profile);
    persist(next);
    setShowProfile(false);
    setToast("Customer profile saved");
    setTimeout(() => setToast(""), 3000);
  }

  const sectionRows = useMemo(() => {
    const out = [];
    const activeIds = new Set(Object.keys(acc?.cur || {}));
    data.sectionOrder.forEach((sec) => {
      const svcs = data.services.filter((s) => s.section === sec && activeIds.has(s.id));
      if (svcs.length) out.push({ section: sec, svcs });
    });
    return out;
  }, [data, acc]);

  function addRateDescription() {
    if (!acc) return;
    const next=clone(data); const nc=next.customers.find(c=>c.name===selCust); const na=nc.accounts.find(a=>a.wms===selWms);
    let serviceId=addRate.serviceId;
    if(addRate.laborRole){
      if(!addRate.laborPeriod){alert("Choose overtime weekdays, Saturday, Sunday or public holidays.");return;}
      const sectionMap={weekday:"Overtime weekdays",saturday:"Saturday - Minimum 4 hours Charge",sunday:"Sundays or Public Holidays - Minimum 4 hours Charge",publicHoliday:"Sundays or Public Holidays - Minimum 4 hours Charge"};
      const descMap={labour:"Labour per hour/person",supervisor:"Supervisor per hour/person",forklift:"Forklift operator per hour/person"};
      const section=sectionMap[addRate.laborPeriod], desc=descMap[addRate.laborRole];
      const found=next.services.find(s=>s.section===section&&s.desc===desc);
      if(found) serviceId=found.id; else {serviceId="svc"+Date.now();next.services.push({id:serviceId,section,type:"Handling",code:"",desc});}
    }
    if (addRate.manual) {
      if (!addRate.desc.trim() || !addRate.type.trim()) { alert("Enter service type and service description."); return; }
      serviceId="svc"+Date.now();
      const section=addRate.section||"Service - Frozen";
      if (!next.sectionOrder.includes(section)) next.sectionOrder.push(section);
      next.services.push({id:serviceId,section,type:addRate.type.trim(),code:addRate.code.trim().toUpperCase(),desc:addRate.desc.trim()});
    }
    if (!serviceId) { alert("Choose a rate description."); return; }
    const raw=addRate.rate; if (raw==="" || isNaN(Number(raw))) { alert("Enter a valid rate."); return; }
    na.cur[serviceId]=Number(raw); if(!na.history)na.history=[]; na.history.push({id:serviceId,from:null,to:Number(raw),date:todayISO(),action:"new"});
    persist(next); setShowAddRate(false); setAddRate({serviceId:"",rate:"",manual:false,laborRole:"",laborPeriod:"",section:"Service - Frozen",type:"Handling",code:"",desc:""}); setToast("Rate description added"); setTimeout(()=>setToast(""),3000);
  }

  return (
    <div>
      {showAdd && <AddCustomerModal data={data} onClose={() => setShowAdd(false)} onCreate={createCustomer} />}
      {showProfile && cust && <CustomerProfileModal customer={cust} onClose={() => setShowProfile(false)} onSave={saveCustomerProfile} />}
      {showAddRate && <Modal title="Add rate description" onClose={()=>setShowAddRate(false)}>
        <label style={lbl}>Rate description</label>
        <select style={styles.input} value={addRate.manual?"__manual__":(addRate.laborRole?"__labour__":addRate.serviceId)} onChange={e=>{const v=e.target.value;setAddRate(a=>({...a,manual:v==="__manual__",laborRole:v==="__labour__"?"labour":"",laborPeriod:"",serviceId:(v==="__manual__"||v==="__labour__")?"":v}));}}>
          <option value="">— select from rate list —</option>
          {data.services.filter(s=>acc?.cur?.[s.id]===undefined && !["Labour per hour/person","Supervisor per hour/person","Forklift operator per hour/person"].includes(s.desc)).map(s=><option key={s.id} value={s.id}>{s.code? s.code+" — ":""}{s.desc}</option>)}
          <option value="__labour__">Labour / supervisor / forklift hourly rate</option>
          <option value="__manual__">+ Add a new rate description manually</option>
        </select>
        {addRate.laborRole&&<>
          <label style={lbl}>Role</label><select style={styles.input} value={addRate.laborRole} onChange={e=>setAddRate(a=>({...a,laborRole:e.target.value}))}><option value="labour">Labour per hour/person</option><option value="supervisor">Supervisor per hour/person</option><option value="forklift">Forklift operator per hour/person</option></select>
          <label style={lbl}>When does this rate apply?</label><select style={styles.input} value={addRate.laborPeriod} onChange={e=>setAddRate(a=>({...a,laborPeriod:e.target.value}))}><option value="">— select —</option><option value="weekday">Overtime weekdays</option><option value="saturday">Saturday</option><option value="sunday">Sunday</option><option value="publicHoliday">Public holiday</option></select>
        </>}
        {addRate.manual&&<><label style={lbl}>Section</label><select style={styles.input} value={addRate.section} onChange={e=>setAddRate(a=>({...a,section:e.target.value}))}>{data.sectionOrder.map(x=><option key={x}>{x}</option>)}</select><label style={lbl}>Service type</label><input style={styles.input} value={addRate.type} onChange={e=>setAddRate(a=>({...a,type:e.target.value}))}/><label style={lbl}>Code</label><input style={styles.input} value={addRate.code} onChange={e=>setAddRate(a=>({...a,code:e.target.value.toUpperCase()}))}/><label style={lbl}>Service description</label><input style={styles.input} value={addRate.desc} onChange={e=>setAddRate(a=>({...a,desc:e.target.value}))}/></>}
        <label style={lbl}>Rate</label><input type="number" min="0" step="0.01" style={styles.input} value={addRate.rate} onChange={e=>setAddRate(a=>({...a,rate:e.target.value}))}/>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}><button style={styles.btn()} onClick={()=>setShowAddRate(false)}>Cancel</button><button style={styles.btn("primary")} onClick={addRateDescription}>Add rate</button></div>
      </Modal>}
      {showDelete && cust && (
        <Modal title="Delete customer" onClose={() => setShowDelete(false)}>
          <p style={{ fontSize: 13.5, lineHeight: 1.6, margin: "0 0 12px" }}>
            This permanently deletes <strong>{cust.name}</strong> and all of its accounts
            ({cust.accounts.map((a) => a.wms).join(", ")}), including every rate and history record. This can't be undone.
          </p>
          <label style={lbl}>Type the customer name to confirm</label>
          <input style={styles.input} value={confirmText} onChange={(e) => setConfirmText(e.target.value)} placeholder={cust.name} autoFocus />
          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 16 }}>
            <button style={styles.btn()} onClick={() => setShowDelete(false)}>Cancel</button>
            <button
              style={{ ...styles.btn("danger"), opacity: confirmText.trim() === cust.name ? 1 : 0.5, cursor: confirmText.trim() === cust.name ? "pointer" : "not-allowed", background: confirmText.trim() === cust.name ? "#A32D2D" : "#fff", color: confirmText.trim() === cust.name ? "#fff" : "#A32D2D" }}
              disabled={confirmText.trim() !== cust.name}
              onClick={confirmDeleteCustomer}>
              <i className="ti ti-trash" style={{ marginRight: 5 }} />Delete customer
            </button>
          </div>
        </Modal>
      )}
      {toast && <div style={{ position: "fixed", bottom: 22, left: "50%", transform: "translateX(-50%)", background: "#0F6E56", color: "#fff", padding: "10px 18px", borderRadius: 10, fontSize: 13, fontWeight: 500, zIndex: 80, boxShadow: "0 4px 14px rgba(0,0,0,0.2)" }}><i className="ti ti-check" style={{ marginRight: 7 }} />{toast}</div>}

      <div style={{ display: "flex", gap: 12, alignItems: "flex-end", marginBottom: 16, flexWrap: "wrap" }}>
        <div><label style={lbl}>Customer</label><select style={{ ...styles.input, width: 230 }} value={selCust} onChange={(e) => setSelCust(e.target.value)}>{data.customers.map((c) => <option key={c.name} value={c.name}>{c.name} (T{c.tier ?? "-"})</option>)}</select></div>
        <div><label style={lbl}>Customer account (WMS)</label><select style={{ ...styles.input, width: 170 }} value={selWms} onChange={(e) => setSelWms(e.target.value)}>{cust?.accounts.map((a) => <option key={a.wms} value={a.wms}>{a.wms}</option>)}</select></div>
        <button title="Customer profile" style={{...styles.btn(),padding:"8px 10px",opacity:editMode?0.5:1}} disabled={editMode} onClick={()=>setShowProfile(true)}><i className="ti ti-id-badge-2" /></button>
        <button title="Add account" style={{...styles.btn(),padding:"8px 10px",opacity:editMode?0.5:1}} disabled={editMode} onClick={addAccount}><i className="ti ti-plus" /></button>
        {cust&&cust.accounts.length>1&&<button title="Delete account" style={{...styles.btn("danger"),padding:"8px 10px",opacity:editMode?0.5:1}} disabled={editMode} onClick={deleteAccount}><i className="ti ti-trash" /></button>}
        <button title="Add customer" style={{...styles.btn("primary"),padding:"8px 10px",opacity:editMode?0.5:1}} disabled={editMode} onClick={()=>setShowAdd(true)}><i className="ti ti-user-plus" /></button>
        {data.customers.length>1&&<button title="Delete customer" style={{...styles.btn("danger"),padding:"8px 10px",opacity:editMode?0.5:1}} disabled={editMode} onClick={deleteCustomer}><i className="ti ti-trash" /></button>}
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 10 }}>
          {editMode&&<button title="Add new charge" style={{...styles.btn(),padding:"8px 12px"}} onClick={()=>setShowAddRate(true)}><span style={{fontSize:16,fontWeight:700,lineHeight:1,marginRight:6}}>+</span>Add new charge</button>}
          {editMode&&newServiceIds.size>0&&<span style={{...styles.pill("#FAEEDA","#854F0B")}}>{newServiceIds.size} new</span>}
          {editMode&&<span style={{fontSize:12.5,color:dirtyCount?"#854F0B":"#7790a8"}}>{dirtyCount?dirtyCount+" unsaved":"No changes"}</span>}
          {!editMode?<button style={styles.btn("primary")} onClick={()=>setEditMode(true)}><i className="ti ti-pencil" style={{marginRight:5}} />Edit rates</button>:<><button title="Cancel" style={{...styles.btn(),padding:"8px 10px"}} onClick={()=>{setDrafts({});setEditMode(false);}}><i className="ti ti-x" /></button><button title="Update rates" style={{...styles.btn("primary"),padding:"8px 10px",opacity:dirtyCount?1:0.5,cursor:dirtyCount?"pointer":"not-allowed"}} disabled={!dirtyCount} onClick={applyUpdate}><i className="ti ti-device-floppy" /></button></>}
        </div>
      </div>

      {cust && acc && (
        <div style={{ ...styles.card, overflow: "visible" }}>
          <div style={{ padding: "10px 16px", background: BLUE_SOFT, borderBottom: "1px solid " + BLUE_LINE, display: "flex", alignItems: "center", gap: 10, borderRadius: "12px 12px 0 0" }}>
            <span style={tierPill(cust.tier)}>Tier {cust.tier ?? "-"}</span>
            <span style={{ fontWeight: 600, color: BLUE_DK, fontSize: 14 }}>{cust.name}</span>
            <span style={{ color: "#5a7088", fontSize: 13 }}>/ account</span>
            <span style={{ ...styles.pill("#fff", BLUE), border: "0.5px solid " + BLUE_LINE }}>{acc.wms}</span>
            <span style={{ marginLeft: "auto", fontSize: 12, color: editMode ? "#854F0B" : "#7790a8" }}>{editMode ? "Edit mode · enter new rate, 0 or blank to remove a service" : "View only · click Edit rates to change"}</span>
          </div>
          <table style={{ borderCollapse: "separate", borderSpacing: 0, width: "100%" }}>
            <thead>
              <tr>
                {["Service type", "Code", "Service description", "Previous rate", "Current rate", ...(editMode ? ["New rate"] : []), "Last changed", "Status", ""].map((h, i, arr) => {
                  const isNum = h === "Previous rate" || h === "Current rate" || h === "New rate";
                  return <th key={i} style={{ position: "sticky", top: 0, background: "#f0f6fc", color: BLUE_DK, fontSize: 12, fontWeight: 600, padding: "8px 12px", textAlign: isNum ? "right" : "left", borderBottom: "2px solid " + BLUE_LINE, whiteSpace: "nowrap", zIndex: 2 }}>{h}</th>;
                })}
              </tr>
            </thead>
            <tbody>
              {sectionRows.map((grp, gi) => (
                <React.Fragment key={gi}>
                  <tr><td colSpan={editMode ? 9 : 8} style={{ background: "#eaf2fb", color: BLUE_DK, fontWeight: 600, fontSize: 12.5, padding: "6px 12px", borderTop: "1px solid " + BLUE_LINE, borderBottom: "1px solid " + BLUE_LINE }}>{grp.section}</td></tr>
                  {grp.svcs.map((s, ri) => {
                    const existing = acc.cur[s.id];
                    const draftVal = drafts[s.id];
                    const fieldVal = draftVal !== undefined ? draftVal : (existing === undefined ? "" : String(existing));
                    const lastDate = (acc.history || []).filter((h) => h.id === s.id).slice(-1)[0]?.date || "";
                    const prev = prevForService(s.id);
                    const isNew = newServiceIds.has(s.id);
                    const draftIsRemoval = draftVal !== undefined && (String(draftVal).trim() === "" || String(draftVal).trim() === "0");
                    const isDirty = draftVal !== undefined && String(draftVal) !== (existing === undefined ? "" : String(existing));
                    const histCount = (acc.history || []).filter((h) => h.id === s.id).length;
                    return (
                      <tr key={s.id} style={{ background: isDirty ? "#fff8ec" : (ri % 2 ? "#fbfdff" : "#fff") }}>
                        <td style={{ padding: "5px 12px", fontSize: 11.5, color: "#62788f", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>{s.type}</td>
                        <td style={{ padding: "5px 12px", fontSize: 12, fontWeight: 600, color: BLUE, borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>{s.code || "—"}</td>
                        <td style={{ padding: "5px 12px", fontSize: 12.5, borderBottom: "0.5px solid #eef3f9" }}>{s.desc}</td>
                        <td style={{ padding: "5px 12px", textAlign: "right", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>
                          {prev ? (
                            <span style={{ fontSize: 12, color: "#7790a8", fontVariantNumeric: "tabular-nums" }}>
                              {fmtAUD(prev.rate)}<span style={{ color: "#a8bbd0", marginLeft: 6, fontSize: 11 }}>{fmtDate(prev.date)}</span>
                            </span>
                          ) : <span style={{ color: "#c9d4e0" }}>—</span>}
                        </td>
                        <td style={{ padding: "5px 12px", textAlign: "right", fontSize: 12.5, color: existing === undefined ? "#c9d4e0" : "#1b2733", fontVariantNumeric: "tabular-nums", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>{existing === undefined ? "—" : fmtAUD(existing)}</td>
                        {editMode && (
                          <td style={{ padding: "3px 12px", textAlign: "right", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>
                            <div style={{ display: "inline-flex", alignItems: "center", gap: 2 }}>
                              <span style={{ color: "#90a8c2", fontSize: 12 }}>$</span>
                              <input value={fieldVal} onChange={(e) => setDraft(s.id, e.target.value)} placeholder="—"
                                style={{ ...styles.input, width: 92, textAlign: "right", padding: "5px 7px", border: "0.5px solid " + (draftIsRemoval && existing !== undefined ? "#E09595" : isDirty ? "#EF9F27" : "#c4d6ea"), background: draftIsRemoval && existing !== undefined ? "#fdf2f2" : isDirty ? "#fffdf7" : "#fff" }} />
                            </div>
                          </td>
                        )}
                        <td style={{ padding: "5px 12px", fontSize: 11.5, color: "#7790a8", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>{lastDate ? fmtDate(lastDate) : "—"}</td>
                        <td style={{ padding: "5px 12px", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>
                          {draftIsRemoval && existing !== undefined ? <span style={styles.pill("#FCEBEB", "#A32D2D")}><i className="ti ti-trash" style={{ marginRight: 3 }} />Removing</span>
                            : isNew ? <span style={styles.pill("#FAEEDA", "#854F0B")}><i className="ti ti-sparkles" style={{ marginRight: 3 }} />New</span>
                            : isDirty ? <span style={styles.pill("#E6F1FB", BLUE_DK)}>Edited</span>
                            : existing !== undefined ? <span style={{ color: "#9fb3c8", fontSize: 11.5 }}>Active</span>
                            : histCount ? <span style={styles.pill("#F1EFE8", "#5F5E5A")}>Removed</span>
                            : <span style={{ color: "#c9d4e0", fontSize: 11.5 }}>No service</span>}
                        </td>
                        <td style={{ padding: "5px 12px", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap", textAlign: "center" }}>
                          {histCount ? (
                            <button onClick={() => setHistSvc(s)} title="View rate history" style={{ border: "none", background: "none", cursor: "pointer", color: BLUE, fontSize: 16, padding: 2 }}><i className="ti ti-history" /></button>
                          ) : null}
                        </td>
                      </tr>
                    );
                  })}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {histSvc && (
        <Modal title={"Rate history · " + (histSvc.code ? histSvc.code + " — " : "") + histSvc.desc} onClose={() => setHistSvc(null)}>
          <div style={{ fontSize: 12.5, color: "#5a7088", marginBottom: 10 }}>{cust.name} · {acc.wms}</div>
          {(() => {
            const h = (acc.history || []).filter((e) => e.id === histSvc.id).slice().reverse();
            if (!h.length) return <div style={{ color: "#7790a8", fontSize: 13 }}>No history yet.</div>;
            return (
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                <thead><tr>
                  <th style={{ textAlign: "left", padding: "6px 8px", color: BLUE_DK, borderBottom: "1px solid " + BLUE_LINE }}>Date</th>
                  <th style={{ textAlign: "left", padding: "6px 8px", color: BLUE_DK, borderBottom: "1px solid " + BLUE_LINE }}>Change</th>
                  <th style={{ textAlign: "right", padding: "6px 8px", color: BLUE_DK, borderBottom: "1px solid " + BLUE_LINE }}>From</th>
                  <th style={{ textAlign: "right", padding: "6px 8px", color: BLUE_DK, borderBottom: "1px solid " + BLUE_LINE }}>To</th>
                </tr></thead>
                <tbody>
                  {h.map((e, i) => (
                    <tr key={i}>
                      <td style={{ padding: "6px 8px", borderBottom: "0.5px solid #eef3f9", whiteSpace: "nowrap" }}>{fmtDate(e.date)}</td>
                      <td style={{ padding: "6px 8px", borderBottom: "0.5px solid #eef3f9" }}>
                        {e.action === "new" ? <span style={styles.pill("#FAEEDA", "#854F0B")}>New</span>
                          : e.action === "remove" ? <span style={styles.pill("#FCEBEB", "#A32D2D")}>Removed</span>
                          : <span style={styles.pill("#E6F1FB", BLUE_DK)}>Changed</span>}
                      </td>
                      <td style={{ padding: "6px 8px", borderBottom: "0.5px solid #eef3f9", textAlign: "right", color: "#7790a8", fontVariantNumeric: "tabular-nums" }}>{e.from === null || e.from === undefined ? "—" : fmtAUD(e.from)}</td>
                      <td style={{ padding: "6px 8px", borderBottom: "0.5px solid #eef3f9", textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{e.to === null || e.to === undefined ? "Removed" : fmtAUD(e.to)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            );
          })()}
        </Modal>
      )}
    </div>
  );
}

function App() {
  const { data, ready, persist } = useStore();
  const [tab, setTab] = useState("current");
  const [activeQuote, setActiveQuote] = useState(null);
  if (!ready || !data) return <div style={{ ...styles.app, display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:BLUE_DK }}>Loading rate card…</div>;
  function openReview(rec){setActiveQuote(rec);setTab("review");}
  function changeTab(t){setTab(t);if(t!=="review")setActiveQuote(null);}
  return <div style={styles.app}><TopBar tab={tab} setTab={changeTab}/><div style={styles.body}>
    {tab==="current"?<CurrentRates data={data}/>:tab==="edit"?<EditRates data={data} persist={persist}/>:tab==="review"&&activeQuote?<QuoteReview data={data} persist={persist} record={activeQuote} onBack={()=>setTab("quote")} onSaved={(item)=>{setActiveQuote(null);setTab("quoted");}}/>:tab==="quoted"?<SavedQuotes onOpen={openReview}/>:<CreateQuote data={data} onReview={openReview}/>} 
  </div></div>;
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

</script>
<script>
(function () {
  function showError(msg) {
    var l = document.getElementById("loading"); if (l) l.style.display = "none";
    var e = document.getElementById("err"); e.style.display = "block";
    e.textContent = "Couldn't start the app.\n\n" + msg +
      "\n\nIf this mentions a network/script error, you may be offline — this version needs internet the first time to load React. Tell me and I'll make a fully offline version.";
  }
  try {
    if (typeof React === "undefined" || typeof ReactDOM === "undefined") return showError("React did not load (CDN blocked or no internet connection).");
    if (typeof Babel === "undefined") return showError("Babel did not load (CDN blocked or no internet connection).");
    var source = document.getElementById("source").textContent;
    var compiled = Babel.transform(source, { presets: ["react"] }).code;
    document.getElementById("loading").style.display = "none";
    (0, eval)(compiled);
  } catch (err) { showError((err && err.message ? err.message : String(err))); if (window.console) console.error(err); }
})();
</script>
</body>
</html>
